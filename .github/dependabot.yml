# Dependabot: 의존성 취약점 자동 감지 + 업데이트 PR 생성
version: 2
updates:
  # Python dependencies (requirements.txt)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5

  # npm (Cloudflare Worker)
  - package-ecosystem: "npm"
    directory: "/worker"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
