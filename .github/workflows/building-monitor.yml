name: Seoul Building Monitor

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      send_status:
        description: 'Email deployment and actual collection status to the configured building-alert recipient'
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'building-monitor/**'
      - '.github/workflows/building-monitor.yml'
  pull_request:
    paths:
      - 'building-monitor/**'
      - '.github/workflows/building-monitor.yml'

permissions:
  contents: read

concurrency:
  group: building-monitor-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Validate building-monitor behavior
        working-directory: building-monitor
        run: python -m unittest discover -s tests -v

  monitor:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Restore delivery history and API request budget
        id: restore-state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: building-monitor/data/cloud/state.sqlite3
          key: building-monitor-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            building-monitor-state-v1-
      - name: Collect listings and send new qualifying alerts
        working-directory: building-monitor
        env:
          ONBID_SERVICE_KEY: ${{ secrets.ONBID_SERVICE_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          BUILDING_ALERT_TO: ${{ secrets.BUILDING_ALERT_TO }}
          BUILDING_REVIEWS_CSV: ${{ secrets.BUILDING_REVIEWS_CSV }}
          BUILDING_FEED_URL: ${{ secrets.BUILDING_FEED_URL }}
          BUILDING_FEED_TOKEN: ${{ secrets.BUILDING_FEED_TOKEN }}
          SEND_STATUS: ${{ github.event_name == 'workflow_dispatch' && inputs.send_status }}
        run: |
          if [ "$SEND_STATUS" = "true" ]; then
            python -m building_monitor.deployment --send-status
          else
            python -m building_monitor.deployment
          fi
      - name: Persist state even after a source or delivery failure
        if: always() && hashFiles('building-monitor/data/cloud/state.sqlite3') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: building-monitor/data/cloud/state.sqlite3
          key: building-monitor-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save collection health
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: building-monitor-health-${{ github.run_id }}
          path: building-monitor/data/cloud/health.json
          retention-days: 7
