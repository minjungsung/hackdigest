name: Strict Project Validation
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.project.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        project: [{"name":"root-python-requirements","ecosystem":"python-requirements","path":".","runtime-version":"3.12","manifest":"requirements.txt","timeout-minutes":15},{"name":"worker-node","ecosystem":"npm","path":"worker","runtime-version":"24","manifest":"package.json","lockfile":"package-lock.json","test-command":"npm test","timeout-minutes":15}]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: startsWith(matrix.project.ecosystem, 'python-')
        with:
          python-version: ${{ matrix.project.runtime-version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: matrix.project.ecosystem == 'npm'
        with:
          node-version: ${{ matrix.project.runtime-version }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: minjungsung/.github
          ref: 53eef31813cadd2611ade5062449c5089bbe1774
          path: .dependency-policy-source
          persist-credentials: false
      - name: Validate the actual reviewed project on every PR
        env:
          PROJECT_JSON: ${{ toJSON(matrix.project) }}
          PYTHONPATH: .dependency-policy-source/dependency-policy
          CI: 'true'
        run: python3 .dependency-policy-source/dependency-policy/scripts/run_project.py --project-json "$PROJECT_JSON" --repository-root "$GITHUB_WORKSPACE"
