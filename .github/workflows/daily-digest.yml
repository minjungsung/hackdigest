name: HackDigest Daily

on:
  schedule:
    - cron: '0 0 * * *'    # UTC 00:00 = KST 09:00
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode (sends only to test email)'
        required: false
        type: boolean
        default: true

jobs:
  # Security scan - check for leaked credentials
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for hardcoded secrets
        run: |
          echo "Scanning for potential credential leaks..."
          PATTERNS='password|secret|api_key|token|credential|smtp.*pass|app_password'
          # Search Python files for hardcoded secrets (ignore imports and variable names)
          FOUND=$(grep -rniE "($PATTERNS)\s*=\s*['\"][^'\"]+['\"]" src/ --include="*.py" || true)
          if [ -n "$FOUND" ]; then
            echo "::error::Potential hardcoded secrets found!"
            echo "$FOUND"
            exit 1
          fi
          echo "✅ No hardcoded secrets found."

  digest:
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run HackDigest
        run: python -m src.main
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Test mode: send only to test email; Production: send to all recipients
          EMAIL_TO: ${{ github.event.inputs.test_mode == 'true' && secrets.EMAIL_TEST_TO || secrets.EMAIL_TO }}
