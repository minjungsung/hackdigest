name: HackDigest Daily

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode (sends only to test email)'
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      test_mode:
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify-publication:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/strict-project-validation.yml

  # Security scan - check for leaked credentials
  security-scan:
    needs: verify-publication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Scan for hardcoded secrets
        run: |
          echo "Scanning for potential credential leaks..."
          PATTERNS='password|secret|api_key|token|credential|smtp.*pass|app_password'
          # Search Python files for hardcoded secrets (ignore imports and variable names)
          FOUND=$(grep -rniE "($PATTERNS)\s*=\s*['\"][^'\"]+['\"]" src/ --include="*.py" || true)
          if [ -n "$FOUND" ]; then
            echo "::error::Potential hardcoded secrets found!"
            echo "$FOUND"
            exit 1
          fi
          echo "✅ No hardcoded secrets found."

  digest:
    runs-on: ubuntu-latest
    needs: [verify-publication, security-scan]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Restore article cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: data/cache
          key: hackdigest-v2-${{ github.run_id }}
          restore-keys: |
            hackdigest-v2-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run HackDigest
        run: python -m src.main
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Test mode: override subscribers with single test email
          EMAIL_TEST_TO: ${{ (github.event.inputs.test_mode == 'true' || inputs.test_mode) && secrets.EMAIL_TEST_TO || '' }}
