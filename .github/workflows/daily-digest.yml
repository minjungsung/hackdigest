name: HackDigest Daily

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode (sends only to test email)'
        required: false
        type: boolean
        default: true
      test_tech_only:
        description: 'In test mode, send only the combined Tech email'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      test_mode:
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify-publication:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.test_mode == 'true')
    uses: ./.github/workflows/strict-project-validation.yml

  # Security scan - check for leaked credentials
  security-scan:
    needs: verify-publication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Scan for hardcoded secrets
        run: |
          echo "Scanning for potential credential leaks..."
          PATTERNS='password|secret|api_key|token|credential|smtp.*pass|app_password'
          # Search Python files for hardcoded secrets (ignore imports and variable names)
          FOUND=$(grep -rniE "($PATTERNS)\s*=\s*['\"][^'\"]+['\"]" src/ --include="*.py" || true)
          if [ -n "$FOUND" ]; then
            echo "::error::Potential hardcoded secrets found!"
            echo "$FOUND"
            exit 1
          fi
          echo "✅ No hardcoded secrets found."

  digest:
    runs-on: ubuntu-latest
    needs: [verify-publication, security-scan]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Restore article cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: data/cache
          key: hackdigest-v4-${{ github.run_id }}
          restore-keys: |
            hackdigest-v4-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run HackDigest
        run: python -m src.main
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Test mode: override subscribers with single test email
          EMAIL_TEST_TO: ${{ (github.event.inputs.test_mode == 'true' || inputs.test_mode) && secrets.EMAIL_TEST_TO || '' }}
          HACKDIGEST_TEST_MODE: ${{ github.event.inputs.test_mode == 'true' || inputs.test_mode }}
          TEST_TECH_ONLY: ${{ github.event.inputs.test_tech_only == 'true' }}
