name: HackDigest Daily

on:
  schedule:
    - cron: '15 1 * * *'    # UTC 01:15 = KST 10:15
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode (sends only to test email)'
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      test_mode:
        required: false
        type: boolean
        default: true

jobs:
  # Security scan - check for leaked credentials
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for hardcoded secrets
        run: |
          echo "Scanning for potential credential leaks..."
          PATTERNS='password|secret|api_key|token|credential|smtp.*pass|app_password'
          # Search Python files for hardcoded secrets (ignore imports and variable names)
          FOUND=$(grep -rniE "($PATTERNS)\s*=\s*['\"][^'\"]+['\"]" src/ --include="*.py" || true)
          if [ -n "$FOUND" ]; then
            echo "::error::Potential hardcoded secrets found!"
            echo "$FOUND"
            exit 1
          fi
          echo "✅ No hardcoded secrets found."

  digest:
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore article cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: hackdigest-v2-${{ github.run_id }}
          restore-keys: |
            hackdigest-v2-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run HackDigest
        run: python -m src.main
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Test mode: override subscribers with single test email
          EMAIL_TEST_TO: ${{ (github.event.inputs.test_mode == 'true' || inputs.test_mode) && secrets.EMAIL_TEST_TO || '' }}
