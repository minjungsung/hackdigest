name: JHU Morning Study Brief

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '테스트 이메일 / 즉시 발송 / 발송 없이 점검'
        type: choice
        options: [test, send, preview]
        default: test
        required: true
  schedule:
    - cron: '0 0 * * *' # 09:00 Asia/Seoul; scheduled Actions may be delayed

permissions:
  contents: read

concurrency:
  group: jhu-study-brief
  cancel-in-progress: false

jobs:
  email:
    if: github.event_name == 'workflow_dispatch' || vars.COURSE_BRIEF_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Send private course briefing
        run: |
          case "$BRIEF_MODE" in
            test) python -m src.course_brief --test ;;
            preview) python -m src.course_brief --preview ;;
            send) python -m src.course_brief ;;
            *) exit 1 ;;
          esac
        env:
          BRIEF_MODE: ${{ inputs.mode || 'send' }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          COURSE_EMAIL_TO: ${{ secrets.COURSE_EMAIL_TO }}
          COURSE_BRIEF_DATA: ${{ secrets.COURSE_BRIEF_DATA }}
          CANVAS_CALENDAR_FEED: ${{ secrets.CANVAS_CALENDAR_FEED }}
